# Nginx reverse proxy for app.goodbathroomrenos.ca
# This file is copied to: /etc/nginx/sites-available/app.goodbathroomrenos.ca
# Then symlinked to:      /etc/nginx/sites-enabled/

# --- HTTP (port 80) ---
# After Certbot runs, it will auto-modify this block to redirect to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name app.goodbathroomrenos.ca;

    # Certbot challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS (port 443) ---
# The ssl_certificate lines below will be auto-managed by Certbot.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.goodbathroomrenos.ca;

    # SSL — managed by Certbot (uncommented automatically after certbot --nginx)
    # ssl_certificate /etc/letsencrypt/live/app.goodbathroomrenos.ca/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/app.goodbathroomrenos.ca/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Allow large file uploads (assessment photos & PDFs)
    client_max_body_size 50M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip Compression
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # --- SSE / Real-time notifications stream ---
    # Buffering MUST be off for Server-Sent Events to work.
    location /api/notifications/stream {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # --- Static assets with long-term cache ---
    location /_next/static/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Default: proxy everything to the Next.js app ---
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
