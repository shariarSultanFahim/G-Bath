# Nginx reverse proxy for goodbathroomrenosapp.ca
# Copy to: /etc/nginx/sites-available/goodbathroomrenosapp.ca
# Symlink: ln -s /etc/nginx/sites-available/goodbathroomrenosapp.ca /etc/nginx/sites-enabled/

# --- HTTP (port 80) ---
# Use this block first (before Certbot). After SSL, Certbot redirects HTTP → HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name goodbathroomrenosapp.ca www.goodbathroomrenosapp.ca;

    client_max_body_size 50M;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Temporary: proxy until SSL is issued (switch to HTTPS redirect after certbot)
    location /api/notifications/stream {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

