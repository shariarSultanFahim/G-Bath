name: CI/CD — Build, Push & Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ───────────────────────────────────────────
  # Job 1: Lint & Typecheck
  # ───────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck

  # ───────────────────────────────────────────
  # Job 2: Build Docker Image & Push to GHCR
  # ───────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ───────────────────────────────────────────
  # Job 3: Deploy to Hostinger VPS
  # ───────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            echo "===== Starting deployment ====="

            # 1. Ensure project directory exists
            mkdir -p /var/www/g-bath
            cd /var/www/g-bath

            # 2. Write .env from GitHub Secret
            #    The entire .env content is stored in a single secret called ENV_FILE
            echo '${{ secrets.ENV_FILE }}' > .env

            # 3. Write docker-compose.yml (always keep it in sync with repo)
            cat > docker-compose.yml << 'COMPOSE_EOF'
            services:
              app:
                image: ghcr.io/${{ github.repository }}:latest
                container_name: gbath-app
                restart: unless-stopped
                ports:
                  - "127.0.0.1:5000:5000"
                env_file:
                  - .env
                volumes:
                  - uploads_data:/app/public/uploads
                networks:
                  - gbath-network
                depends_on:
                  mongodb:
                    condition: service_healthy
                healthcheck:
                  test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
                  interval: 30s
                  timeout: 5s
                  retries: 3
                  start_period: 15s

              mongodb:
                image: mongo:7.0
                container_name: gbath-mongodb
                restart: unless-stopped
                command: ["--replSet", "rs0", "--bind_ip_all"]
                volumes:
                  - mongodb_data:/data/db
                ports:
                  - "127.0.0.1:27017:27017"
                environment:
                  MONGO_INITDB_DATABASE: g-bath
                networks:
                  - gbath-network
                healthcheck:
                  test: ["CMD", "mongosh", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"]
                  interval: 5s
                  timeout: 5s
                  retries: 10
                  start_period: 2s

            networks:
              gbath-network:
                driver: bridge

            volumes:
              mongodb_data:
                driver: local
              uploads_data:
                driver: local
            COMPOSE_EOF

            # 4. Log in to GHCR on VPS
            echo '${{ secrets.GHCR_PAT }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

            # 5. Pull latest image & restart
            docker compose pull app
            docker compose up -d --remove-orphans

            # 6. Cleanup unused images
            docker image prune -f

            echo "===== Deployment complete ====="
