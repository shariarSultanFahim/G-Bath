name: CI/CD — Build, Push & Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/shariarsultanfahim/g-bath
  SITE_URL: https://goodbathroomrenosapp.ca

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck

  build-and-push:
    name: Build & Push Docker Image
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.SITE_URL }}
            NEXT_PUBLIC_API_URL=${{ env.SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: docker-compose.yml
          target: /var/www/g-bath
          strip_components: 0

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: ENV_FILE,GHCR_PAT,GHCR_USER
          script: |
            set -euo pipefail
            echo "===== Starting deployment ====="

            mkdir -p /var/www/g-bath
            cd /var/www/g-bath

            if [ -z "${ENV_FILE:-}" ]; then
              echo "ERROR: ENV_FILE secret is empty"
              exit 1
            fi
            if [ -z "${GHCR_PAT:-}" ]; then
              echo "ERROR: GHCR_PAT secret is empty — create a classic PAT with read:packages"
              exit 1
            fi

            printf '%s\n' "$ENV_FILE" > .env
            chmod 600 .env

            # Trim whitespace/newlines that break docker login
            GHCR_PAT_TRIMMED="$(printf '%s' "$GHCR_PAT" | tr -d '\r\n')"
            echo "$GHCR_PAT_TRIMMED" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            docker compose pull app
            docker compose up -d --remove-orphans

            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:5000/api/health >/dev/null 2>&1; then
                echo "App is healthy"
                break
              fi
              echo "Waiting for app... ($i)"
              sleep 2
            done

            docker image prune -f
            echo "===== Deployment complete ====="
